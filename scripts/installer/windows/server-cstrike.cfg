// Counter-Strike dedicated server of the installer: "Counter-Strike server"
// in the Start menu. Changes here stay over a reinstall only if this file is
// renamed and exec'd from the command line.
hostname "Counter-Strike 1.7 (Xash3D)"
sv_lan 0
sv_contact ""

sv_maxrate 100000
sv_minrate 25000
sv_maxupdaterate 102
sv_minupdaterate 30

mp_timelimit 20
mp_freezetime 3
mp_roundtime 2.5
mp_autoteambalance 1
mp_limitteams 2
mp_friendlyfire 0
sv_alltalk 0

// the economy of Counter-Strike 2: a weapon comes with all its ammo
mp_refill_bpammo_weapons 2
mp_buy_ammo 0

// YaPB bots fill the server while few players are connected
yb_quota 10
yb_quota_mode fill
sv_hibernate_when_empty 0

log on
sv_cheats 0
pausable 0
