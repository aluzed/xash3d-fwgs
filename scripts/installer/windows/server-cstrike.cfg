// Counter-Strike dedicated server of the installer: "Counter-Strike server"
// in the Start menu. Changes here stay over a reinstall only if this file is
// renamed and exec'd from the command line.
hostname "Counter-Strike 1.7 (Xash3D)"
sv_lan 0
sv_contact ""

sv_maxrate 100000
sv_minrate 25000
sv_maxupdaterate 102
sv_minupdaterate 30

sv_alltalk 0

// the economy of Counter-Strike 2: a weapon comes with all its ammo
mp_buy_ammo 0

// The rules come from the mode, executed after this file on every map
// (story 056): the shortcut starts in "match"; "sv_mode" in this console
// switches to "ffa", "csdm ffa" or "csdm team". The bots of the modes that
// have them: modes/bots.cfg of extras.pk3 (10 YaPB bots), a copy of it in
// cstrike\modes
// to change them.
sv_hibernate_when_empty 0

log on
sv_cheats 0
pausable 0
