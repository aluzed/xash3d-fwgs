// Field validation server of the dedicated server stories (034, 050)
hostname "Xash3D multithreading test"
sv_lan 0
sv_contact ""

// Competitive public rates
sv_maxrate 100000
sv_minrate 25000
sv_maxupdaterate 102
sv_minupdaterate 30

mp_timelimit 20
mp_freezetime 3
mp_roundtime 2.5
mp_autoteambalance 1
mp_limitteams 2
mp_friendlyfire 0
mp_autokick 0
sv_alltalk 0

// Bots: how many in modes/bots.cfg, executed by the modes that have bots
// (story 056); none in a match
bot_join_after_player 0
bot_difficulty 1

// Xash3D sleeps 50 ms per frame when no player is connected, bots excluded:
// the bots would play at 20 Hz
sv_hibernate_when_empty 0

log on

sv_aim 0
pausable 0
sv_cheats 0

bot_auto_vacate 0

// rcon_password is set from the command line by run.sh (RCON_PASSWORD)

// The rules come from the mode (sv_mode, story 056: run.sh starts in
// "csdm ffa"), executed after this file on every map
