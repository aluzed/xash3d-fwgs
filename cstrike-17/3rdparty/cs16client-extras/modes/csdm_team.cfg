// Mode "csdm team" (stories 056, 060): deathmatch with respawn, terrorists
// against counter-terrorists, the settings of "csdm ffa" with teams kept
// balanced; a team's score is its frags.
// Every mode sets the same cvars: the order of the switches never matters.

mp_freeforall                   0
mp_round_infinite               1
mp_forcerespawn                 0.7
mp_respawn_immunitytime         2
mp_respawn_immunity_effects     1
mp_give_player_c4               0
mp_weapons_allow_map_placed     0
mp_item_staytime                5
mp_free_armor                   2
mp_t_default_grenades           "hegrenade flash sgren"
mp_ct_default_grenades          "hegrenade flash sgren"
mp_t_default_weapons_primary    "ak47"
mp_ct_default_weapons_primary   "ak47"
mp_t_default_weapons_secondary  "deagle"
mp_ct_default_weapons_secondary "deagle"
mp_refill_bpammo_weapons        3
mp_buy_anywhere                 1
mp_buytime                      -1
mp_startmoney                   16000
mp_maxmoney                     16000
mp_freezetime                   0
mp_roundtime                    1.92
mp_forcecamera                  0
mp_forcechasecam                0
mp_limitteams                   2
mp_autoteambalance              1
mp_friendlyfire                 0
mp_timelimit                    20
mp_maxrounds                    0
mp_winlimit                     0
mp_fraglimit                    0

exec modes/bots.cfg
